<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한태은 - 현재완료 오답 노트</title>
<style>
:root{
  --deep:#04305b;
  --mid:#0a4a85;
  --light:#1f7fc9;
  --aqua:#62d2ff;
  --coral:#ff8a7a;
  --coral2:#ffb38a;
  --pink:#ffd1d8;
  --gold:#ffd773;
  --white:#ffffff;
  --glass:rgba(255,255,255,0.12);
  --glass-strong:rgba(255,255,255,0.22);
  --shadow:0 12px 40px rgba(0,40,90,0.35);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  color:#0e2a4d;
  min-height:100vh;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(255,255,255,0.55), transparent 45%),
    radial-gradient(ellipse at 20% 20%, rgba(98,210,255,0.45), transparent 50%),
    linear-gradient(180deg, #6dc8ff 0%, #2b89cc 25%, #0c5395 60%, #042f5f 100%);
  background-attachment: fixed;
  overflow-x:hidden;
}

.rays{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    linear-gradient(110deg, transparent 38%, rgba(255,255,255,0.18) 41%, transparent 44%),
    linear-gradient(120deg, transparent 55%, rgba(255,255,255,0.12) 58%, transparent 62%),
    linear-gradient(95deg, transparent 18%, rgba(255,255,255,0.10) 22%, transparent 26%);
  mix-blend-mode:screen;
  animation: rayShift 16s ease-in-out infinite alternate;
}
@keyframes rayShift{ from{transform:translateX(-2%);} to{transform:translateX(2%);} }

.bubbles{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
.bubble{
  position:absolute; bottom:-80px; border-radius:50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.25) 60%, rgba(255,255,255,0.05));
  box-shadow: inset -1px -1px 4px rgba(0,0,0,0.05), 0 2px 6px rgba(255,255,255,0.25);
  opacity:0.85;
  animation: rise linear infinite;
}
@keyframes rise{
  0%   {transform: translateY(0) translateX(0);}
  50%  {transform: translateY(-55vh) translateX(15px);}
  100% {transform: translateY(-110vh) translateX(-10px); opacity:0;}
}

.seabed{
  position:fixed; bottom:0; left:0; right:0; height:160px; z-index:0; pointer-events:none;
  background: linear-gradient(180deg, transparent 0%, rgba(2,28,60,0.0) 10%, rgba(2,28,60,0.55) 100%);
}
.seabed svg{position:absolute; bottom:0; width:100%; height:100%;}

.fish{position:fixed; z-index:0; pointer-events:none; opacity:0.85;}
.fish.f1{top:18%; left:-80px; animation: swim1 28s linear infinite;}
.fish.f2{top:55%; left:-80px; animation: swim1 36s linear infinite; animation-delay:-10s; transform:scale(0.7);}
.fish.f3{top:72%; left:-80px; animation: swim1 42s linear infinite; animation-delay:-20s; transform:scale(0.5);}
@keyframes swim1{ from{transform:translateX(0);} to{transform:translateX(110vw);} }

.wrap{
  position:relative; z-index:2;
  max-width: 980px;
  margin: 0 auto;
  padding: 32px 18px 120px;
}
header.hero{
  text-align:center; color:#fff;
  padding: 28px 22px 22px;
  border-radius: 28px;
  background: linear-gradient(140deg, rgba(255,255,255,0.18), rgba(255,255,255,0.05));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border:1px solid rgba(255,255,255,0.35);
  box-shadow: var(--shadow);
  position:relative; overflow:hidden;
}
header.hero::after{
  content:""; position:absolute; inset:0;
  background: radial-gradient(circle at 80% 0%, rgba(255,215,115,0.35), transparent 50%);
  pointer-events:none;
}
header.hero h1{
  font-size: clamp(22px, 4.6vw, 34px);
  font-weight:800; letter-spacing:-0.5px;
  text-shadow: 0 2px 14px rgba(0,30,80,0.5);
}
header.hero p.sub{ margin-top:8px; font-size:14px; opacity:0.95;}
.tag-row{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:14px;}
.tag{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 12px; border-radius:999px;
  background: rgba(255,255,255,0.22);
  border:1px solid rgba(255,255,255,0.4);
  font-size:12px; color:#fff; font-weight:600;
}
.tag .dot{width:8px;height:8px;border-radius:50%; background:var(--gold); box-shadow:0 0 8px var(--gold);}

.scoreboard{ display:flex; gap:10px; justify-content:center; margin: 16px auto 0; flex-wrap:wrap;}
.score-pill{
  background: rgba(255,255,255,0.95);
  color: var(--deep);
  border-radius: 16px;
  padding: 10px 16px;
  min-width: 110px;
  text-align:center;
  box-shadow: 0 6px 18px rgba(0,40,90,0.25);
  border:1px solid rgba(255,255,255,0.6);
}
.score-pill .lbl{font-size:11px; color:#5b7a9c; font-weight:700; letter-spacing:0.5px;}
.score-pill .val{font-size:22px; font-weight:800; color:var(--deep);}

.card{
  position:relative;
  margin-top: 22px;
  padding: 22px 22px 18px;
  border-radius: 22px;
  background: linear-gradient(160deg, rgba(255,255,255,0.96), rgba(240,250,255,0.92));
  box-shadow: var(--shadow);
  border:1px solid rgba(255,255,255,0.6);
  overflow:hidden;
}
.card::before{
  content:""; position:absolute; top:-20px; right:-20px; width:140px; height:140px;
  background: radial-gradient(circle, rgba(98,210,255,0.35), transparent 60%);
  border-radius:50%; pointer-events:none;
}
.qhead{ display:flex; align-items:flex-start; gap:12px; margin-bottom:12px;}
.qno{
  flex-shrink:0;
  width: 46px; height:46px; border-radius:14px;
  background: linear-gradient(135deg, var(--light), var(--mid));
  color:#fff; font-weight:800; font-size:18px;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 6px 14px rgba(15,80,150,0.4);
}
.qmeta{flex:1;}
.qtopic{
  display:inline-block; font-size:11px; font-weight:700; padding:3px 9px;
  border-radius:999px; background:#e7f3ff; color:#185a9c; margin-bottom:6px;
}
.qtitle{ font-size:15px; font-weight:600; color:#0e2a4d; line-height:1.55;}

.box{
  background: #f3f9ff;
  border: 1px dashed #b3d4f1;
  border-radius: 12px;
  padding: 12px 14px;
  margin: 10px 0;
  font-family: 'Georgia', serif; color:#10325c;
  white-space: pre-wrap;
}
.choices{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
.choice{
  display:flex; gap:10px; align-items:flex-start;
  padding:11px 14px; border-radius:12px;
  background:#f6fbff; border:1.5px solid #d6e8f7;
  cursor:pointer; transition: all .18s ease;
  font-size:14px; line-height:1.5;
}
.choice:hover{ background:#eaf4ff; border-color:#86bfee; transform: translateY(-1px);}
.choice .num{
  width:24px; height:24px; border-radius:50%; flex-shrink:0;
  background:#e0eef9; color:#185a9c; font-weight:700;
  display:flex; align-items:center; justify-content:center; font-size:12px;
}
.choice.selected{ background:#fff8e1; border-color:#ffd773; }
.choice.selected .num{ background:#ffd773; color:#7a4a00;}
.choice.correct-ans{ background:#e8fbef !important; border-color:#5dc382 !important;}
.choice.correct-ans .num{ background:#5dc382; color:#fff;}
.choice.wrong-ans{ background:#ffeaea !important; border-color:#e57272 !important;}
.choice.wrong-ans .num{ background:#e57272; color:#fff;}

.subq{
  margin: 8px 0;
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  font-size:14px; color:#1a3960;
}
input.fillin{
  border:none; border-bottom:2px solid #6aa8da; background:transparent;
  padding:4px 8px; font-size:15px; min-width:120px; color:#0e2a4d;
  font-family:inherit; font-weight:600;
}
input.fillin:focus{outline:none; border-bottom-color:var(--coral);}

.actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;}
.btn{
  border:none; border-radius:12px; padding:10px 16px;
  font-weight:700; font-size:14px; cursor:pointer; transition:.18s; font-family:inherit;
}
.btn-check{
  background: linear-gradient(135deg, #1f7fc9, #0a4a85); color:#fff;
  box-shadow: 0 6px 14px rgba(15,80,150,0.35);
}
.btn-check:hover{ transform: translateY(-2px); box-shadow: 0 10px 18px rgba(15,80,150,0.45);}
.btn-reset{ background:#eef4fb; color:#1a3960;}
.btn-reset:hover{ background:#dceaf7;}

.prev-answer{
  margin-top:10px; padding:10px 12px; border-radius:10px;
  background: linear-gradient(135deg, #ffe7e2, #ffd1c8);
  border:1px solid #ff9b85; color:#8a2b10; font-size:13px;
}
.prev-answer b{color:#b03000;}

.feedback{
  margin-top:14px; padding:14px 16px; border-radius:14px;
  display:none; font-size:14px; line-height:1.6;
  border-left: 4px solid;
}
.feedback.show{display:block; animation: pop .3s ease;}
@keyframes pop{from{transform:scale(0.96); opacity:0;} to{transform:scale(1); opacity:1;}}
.feedback.ok{background:#e9fbf0; border-color:#3fbf6c; color:#1c6b3c;}
.feedback.no{background:#ffefef; border-color:#e05858; color:#962020;}

.explain{
  margin-top: 12px;
  padding: 14px 16px;
  background: linear-gradient(135deg, #fff9e6, #fff3d0);
  border: 1px solid #ffe28a;
  border-radius: 14px;
  font-size:14px; line-height:1.7; color:#5a3d00;
  position:relative;
}
.explain::before{
  content:"💡 자세한 설명";
  display:block; font-weight:800; color:#a07000; margin-bottom:6px; font-size:13px;
}
.explain b{color:#b04300;}
.explain .ans{
  display:inline-block; padding:2px 8px; border-radius:6px;
  background:#ffd773; color:#5a3d00; font-weight:700;
}
.explain ul{margin: 6px 0 0 18px;}
.explain li{margin: 3px 0;}

.footer{
  text-align:center; color:#fff; opacity:0.85;
  margin-top: 36px; font-size:13px;
  text-shadow: 0 2px 6px rgba(0,30,80,0.4);
}
.celebrate{
  margin: 16px 0; padding: 18px;
  text-align:center; border-radius: 18px;
  background: linear-gradient(135deg, #ffd773, #ff8a7a);
  color:#fff; font-weight:800; font-size:16px;
  box-shadow: var(--shadow);
  display:none;
}
.celebrate.show{display:block;}

.progress-bar{
  height: 8px; border-radius: 999px;
  background: rgba(255,255,255,0.3);
  overflow:hidden; margin-top:14px;
}
.progress-bar > span{
  display:block; height:100%;
  background: linear-gradient(90deg, var(--gold), var(--coral));
  width:0%; transition: width .4s ease;
  box-shadow: 0 0 8px rgba(255,215,115,0.6);
}

@media (max-width:560px){
  .qno{width:40px; height:40px; font-size:16px;}
  .qtitle{font-size:14px;}
}
</style>
</head>

  {
    no:7, topic:"since vs for",
    q:"다음 밑줄 친 부분에서 틀린 것을 바르게 고쳐 쓰시오.",
    box:"She <u>has known him for 2001</u>.",
    type:"input",

    prev:"❌ 이전: for를 그대로 둠 (틀림)",
    explain:`<b>핵심 규칙:</b> 시점은 <span class="ans">since</span>, 기간은 <span class="ans">for</span>!

      <li><b>since</b> + 시점 (2001, last year, March, I was 5...)</li>
      <li><b>for</b> + 기간 (two hours, three years...)</li>

    "2001"은 특정 연도(시점)이므로 <b>since 2001</b> → "She has known him <b>since</b> 2001."`
  },
  {
    no:11, topic:"같은 용법 모두 고르기",
    q:"다음 중 같은 용법으로 쓰인 문장을 모두 고르시오.",
    type:"multi",
    choices:[
      "It has been such a long time since we met.",
      "I have never been to New York.",
      "He has lost his cellphone at the airport.",
      "I've known him since I was 5 years old.",
      "My brother has just finished his homework."
    ],
    answer:[0,3],
    prev:"❌ 이전 답: ②, ⑤ (틀림)",
    explain:`두 개를 모두 고르는 문제예요.
    <ul>
      <li>① It has been ... <b>since we met</b> → <span class="ans">계속</span></li>
      <li>② never been → <span class="ans">경험</span></li>
      <li>③ has lost (지금도 없음) → <span class="ans">결과</span></li>
      <li>④ I've known him <b>since I was 5</b> → <span class="ans">계속</span></li>
      <li>⑤ has <b>just</b> finished → <span class="ans">완료</span></li>
    </ul>
    같은 용법(<b>계속</b>)인 ①과 ④가 정답!`
  },
  {
    no:17, topic:"용법 쓰기",
    q:"밑줄 친 부분의 용법이 무엇인지 각각 쓰시오.",
    type:"multi-fill",
    fields:[
      {label:"1) Have you talked to him yet? — 용법:", answer:"완료"},
      {label:"2) Have you ever made a cake? — 용법:", answer:"경험"}
    ],
    prev:"❌ 이전 답: 1)현재 새로운 이슈, 2)경험 (1번 틀림)",
    explain:`단서 단어를 보세요!
    <ul>
      <li>1) <b>yet</b> = 아직 / 이미 → <span class="ans">완료</span> (의문문에서 yet은 "벌써, 이미")</li>
      <li>2) <b>ever</b> = ~한 적 있니? → <span class="ans">경험</span></li>
    </ul>
    💡 yet, just, already → 완료 / ever, never, before, ~ times → 경험`
  },
  {
    no:18, topic:"같은 용법 찾기",
    q:'다음 중 밑줄 친 부분의 쓰임이 <보기>와 같은 것은? <보기> I haven\'t made the cake <u>yet</u>.',

      <li>② haven't been to France → <b>경험</b></li>
      <li>③ <b>just arrived</b> → <b>완료</b> ✓</li>
      <li>④ have lost → <b>결과</b></li>

    q:"빈칸에 알맞은 것을 골라 쓰시오. (yet / just / already)",

    fields:[

      <li><b>just</b> = "막, 방금" (긍정문)</li>

    (1) <span class="ans">already</span>, (2) <span class="ans">yet</span>, (3) <span class="ans">just</span>`
  },

const container = document.getElementById('container');
let solved = 0, correct = 0;
const total = problems.length;
document.getElementById('totalQ').textContent = total;

function updateScore(){
  document.getElementById('solvedQ').textContent = solved;
  document.getElementById('correctQ').textContent = correct;
  const rate = solved===0 ? 0 : Math.round(correct/solved*100);
  document.getElementById('rateQ').textContent = rate+"%";
  document.getElementById('progBar').style.width = (solved/total*100)+"%";
  if(solved === total){
    document.getElementById('celebrate').classList.add('show');
  }
}

function normalize(s){return (s||'').trim().toLowerCase().replace(/\s+/g,' ').replace(/[.?!,]/g,'');}
